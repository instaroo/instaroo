<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta name="google-site-verification" content="6JtHPxwJi10wH4x3rBl0xphY9n4KUTKeV-_kFPNQJxs" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>اینستارو | ترندهای امروز اینستاگرام بدون اسکرول</title>
<meta name="description" content="ترندها و کلیپ‌های وایرال اینستاگرام در دسته‌بندی‌های مختلف. ببین امروز چی رو از دست دادی!؟؟">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23FF007F'/><stop offset='100%' stop-color='%23FF8C00'/></linearGradient></defs><rect x='3' y='3' width='18' height='18' rx='5' stroke='url(%23g)' stroke-width='2'/><path d='M10 8L15.5 12L10 16V8Z' fill='url(%23g)'/><circle cx='17' cy='7' r='1.5' fill='url(%23g)'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#182238;--line:#26334c;--text:#f5f7fb;--muted:#9aa8bf;--pink:#ff4d8d;--orange:#ff9d4d;--cyan:#5dd6d0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#312044 0,transparent 36%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 16px}
header{border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#0b1020eF;backdrop-filter:blur(16px);z-index:5}
.nav{height:60px;display:flex;align-items:center;justify-content:space-between;gap:18px}

.logo{
  display:flex;
  align-items:center;
  gap:0; 
  font-size:40px;
  font-weight:900;
  letter-spacing:-2px;
  line-height:1;
  direction: ltr; 
}
.logo svg { 
  width: 34px; 
  height: 34px; 
  margin-left: 8px; 
  margin-top: -4px; 
}
.logo span { color:#fff; }
.logo .pink { color:var(--pink); }

.navsmall{color:var(--muted);font-size:13px}
.hero{padding:24px 0 16px;text-align:center}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #ff4d8d55;color:#ff9abb;background:#ff4d8d12;border-radius:30px;padding:5px 12px;font-size:11px;font-weight:700}
h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:10px 0 4px;font-weight:900;letter-spacing:-1px}
.grad{background:linear-gradient(90deg,#ff70a6,#ffbd72);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:18px;margin:0 auto;max-width:580px;line-height:1.5}
footer{margin-top:40px;border-top:1px solid #ffffff12;padding:20px 0 30px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:560px){.nav{height:52px}.logo{font-size:32px;}.logo svg{width:28px;height:28px;margin-left:6px;margin-top:-2px;}.navsmall{display:none}.hero{padding:18px 0 12px}h1{font-size:30px;margin:8px 0 2px;}.hero p{font-size:15px}}
</style>
<style>
/* استایل کشوی افقی و دکمه‌های فلش */
.row-container { margin-bottom: 14px; position: relative; }
.group-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.group-title::before { content: ""; display: block; width: 5px; height: 18px; background: linear-gradient(to bottom, #ff4d8d, #ff8b64); border-radius: 4px; }

.scroll-btn {
  position: absolute;
  top: 55%; 
  transform: translateY(-50%);
  width: 36px; height: 36px;
  background: rgba(11, 16, 32, 0.7);
  border: 1px solid var(--line);
  border-radius: 50%;
  color: white;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 10;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  transition: all 0.2s;
}
.scroll-btn:hover { background: var(--pink); border-color: var(--pink); }

.scroll-right { right: -12px; } 
.scroll-left { left: -12px; } 

.reels-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
.reels-row::-webkit-scrollbar { height: 4px; }
.reels-row::-webkit-scrollbar-track { background: transparent; }
.reels-row::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }
.reels-row::-webkit-scrollbar-thumb:hover { background: var(--pink); }

/* 👇 کارت‌ها */
.reel-card { 
  display: block; 
  flex: 0 0 calc(32% - 8px); 
  background: linear-gradient(160deg,#172239,#10182a); 
  border: 1px solid var(--line); 
  border-radius: 14px; 
  padding: 10px; 
  position: relative; 
  overflow: hidden; 
  transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease; 
  scroll-snap-align: start; 
}
.reel-card:hover, .reel-card:active { 
  transform: translateY(-6px); 
  border-color: #ff4d8d; 
  box-shadow: 0 0 25px rgba(255, 77, 141, 0.4); 
}

.thumb-wrapper { position: relative; margin-bottom: 8px; overflow: hidden; border-radius: 10px; }
.reel-card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; background: #2a2440; display: block; transition: transform 0.5s ease; }
.reel-card:hover img, .reel-card:active img { 
  transform: scale(1.12); 
}

.reel-card .badge { position: absolute; top: 8px; right: 8px; background: linear-gradient(135deg,#ff4d8d,#ff8b64); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; z-index: 2; box-shadow: 0 4px 14px #ff4d8d55; }

.play-btn { 
  position: absolute; 
  bottom: 25%; 
  left: 50%; 
  transform: translateX(-50%); 
  width: 32px; 
  height: 32px; 
  background: rgba(0, 0, 0, 0.5); 
  border: 2px solid rgba(255, 255, 255, 0.9); 
  border-radius: 50%; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  backdrop-filter: blur(2px); 
  transition: background .2s, border-color .2s; 
  z-index: 3; 
}
.play-btn svg { width: 18px; height: 18px; fill: #fff; margin-right: 2px; transition: fill .2s; }

@keyframes pulse {
  0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 141, 0.7); }
  50% { transform: translateX(-50%) scale(1.08); box-shadow: 0 0 0 10px rgba(255, 77, 141, 0); }
  100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 141, 0); }
}

.reel-card:hover .play-btn, .reel-card:active .play-btn { 
  background: var(--pink); 
  border-color: var(--pink);
  animation: pulse 1.5s infinite; 
}
.reel-card:hover .play-btn svg, .reel-card:active .play-btn svg { fill: #fff; }

.reel-card h3 { font-size: 13px; margin: 4px 0; color: #fff; line-height: 1.6; transition: color .2s; }
.reel-card:hover h3, .reel-card:active h3 { color: #ffb8d6; }
.reel-card p { font-size: 11px; color: #ff8db4; margin: 2px 0 0 0; line-height: 1.5; }

@media(max-width:600px){
  .reels-row { gap: 8px; padding-bottom: 8px; } 
  .reel-card { flex: 0 0 calc(47% - 5px); padding: 8px; border-radius: 12px; } 
  .reel-card h3 { font-size: 12px; }
  .reel-card p { font-size: 10px; }
  .reel-card .badge { top: 6px; right: 6px; font-size: 8px; padding: 2px 6px; }
  .reel-card .thumb-wrapper { margin-bottom: 6px; }
  .group-title { font-size: 16px; margin-bottom: 8px; }
  .group-title::before { width: 4px; height: 16px; }
  .play-btn { width: 28px; height: 28px; bottom: 15%; }
  .play-btn svg { width: 16px; height: 16px; }
  .scroll-btn { width: 30px; height: 30px; font-size: 14px; }
  .scroll-right { right: -5px; }
  .scroll-left { left: -5px; }

  /* 👇 حذف زوم عکس در گوشی */
  .reel-card:active img {
    transform: none;
  }
}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="#">
      <span>INSTA</span><span class="pink">ROO</span>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF007F" />
            <stop offset="100%" stop-color="#FF8C00" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="url(#gradLogo)" stroke-width="2"/>
        <path d="M10 8L15.5 12L10 16V8Z" fill="url(#gradLogo)"/>
        <circle cx="17" cy="7" r="1.5" fill="url(#gradLogo)"/>
      </svg>
    </a>
    <div class="navsmall">گلچین روزانه اینستاگرام</div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <div class="pill">✦ انتخاب‌شده برای تو، نه الگوریتم</div>
    <h1>امروز چی رو <span class="grad">از دست دادی؟</span></h1>
    <p>یک‌جا، هر روز، بدون اسکرول بی‌پایان.</p>
  </section>

  <section id="main-content"></section>
</main>
<footer>
  <div class="wrap" style="text-align: center;">
    <p style="margin: 0 0 8px 0; font-weight: 600; color: #f5f7fb;">INSTAROO © 2026</p>
    <p style="margin: 0; font-size: 11px; opacity: 0.7;">تمامی حقوق مادی و معنوی این سایت متعلق به اینستارو است.</p>
    
    <!-- 👇 لینک به پیج اینستاگرام -->
    <a href="https://www.instagram.com/instaroo.ir/" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 15px; color: #ff4d8d; font-weight: bold; font-size: 13px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      ما را در اینستاگرام دنبال کنید
    </a>
  </div>
</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd5580Rh_4Zmc-rSH5cx5BOIN9MPaNp71lN_09PjV4YLylGpEC1vhBpgtc7y3a5BSsxj-2lO2oDVM1/pub?gid=0&single=true&output=csv';

async function loadReels() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = text.trim().split('\n').map(r => r.split(','));
    const headers = rows[0].map(x => x.trim());
    
    let data = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((k, i) => obj[k] = (r[i] || '').trim());
      return obj;
    });

    data.sort((a, b) => {
      let orderA = parseInt(a.order) || 9999;
      let orderB = parseInt(b.order) || 9999;
      return orderA - orderB;
    });

    const groupedData = {};
    data.forEach(item => {
      const grp = item.group ? item.group.trim() : ''; 
      if (grp !== '') { 
        if (!groupedData[grp]) groupedData[grp] = [];
        groupedData[grp].push(item);
      }
    });

    let htmlContent = '';
    let rowIdCounter = 0;

    for (const [groupName, items] of Object.entries(groupedData)) {
      htmlContent += `
        <div class="row-container">
          <h2 class="group-title">${groupName}</h2>
          
          <button class="scroll-btn scroll-right" onclick="document.getElementById('row-${rowIdCounter}').scrollBy({left: 250, behavior: 'smooth'})">&#10094;</button>
          <button class="scroll-btn scroll-left" onclick="document.getElementById('row-${rowIdCounter}').scrollBy({left: -250, behavior: 'smooth'})">&#10095;</button>

          <div class="reels-row" id="row-${rowIdCounter}">
            ${items.map(r => `
              <a href="${r.link}" target="_blank" class="reel-card">
                <div class="thumb-wrapper">
                  ${r.cover ? `<img src="${r.cover}" alt="${r.title}" loading="lazy">` : ''}
                  
                  <div class="play-btn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path d="M8 5v14l11-7z"/>
                    </svg>
                  </div>

                  ${r.category ? `<span class="badge">${r.category}</span>` : ''}
                </div>
                <h3>${r.title}</h3>
                <p>${r.description}</p>
              </a>
            `).join('')}
          </div>
        </div>
      `;
      rowIdCounter++;
    }

    document.getElementById('main-content').innerHTML = htmlContent;

  } catch (e) {
    console.error(e);
    document.getElementById('main-content').innerHTML = '<p style="text-align:center;color:red;">خطا در بارگذاری محتوا.</p>';
  }
}
loadReels();
</script>
</body>
</html>
