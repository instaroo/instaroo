<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>اینستارو | امروز چی رو از دست دادی؟</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#182238;--line:#26334c;--text:#f5f7fb;--muted:#9aa8bf;--pink:#ff4d8d;--orange:#ff9d4d;--cyan:#5dd6d0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#312044 0,transparent 36%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:0 22px}
header{border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#0b1020eF;backdrop-filter:blur(16px);z-index:5}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1}.logo span{color:var(--pink)}
.navsmall{color:var(--muted);font-size:14px}.hero{padding:68px 0 38px;text-align:center}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #ff4d8d55;color:#ff9abb;background:#ff4d8d12;border-radius:30px;padding:7px 14px;font-size:12px;font-weight:700}
h1{font-size:clamp(34px,6vw,58px);line-height:1.35;margin:18px 0 10px;font-weight:900;letter-spacing:-1.5px}
.grad{background:linear-gradient(90deg,#ff70a6,#ffbd72);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:22px;margin:0 auto;max-width:580px;line-height:2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
footer{margin-top:60px;border-top:1px solid #ffffff12;padding:24px 0 36px;color:var(--muted);font-size:12px;text-align:center}
.note{margin-top:22px;color:#8492aa;font-size:11px;text-align:center;line-height:2}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{padding:48px 0 24px}.grid{grid-template-columns:1fr}.navsmall{display:none}.logo{font-size:40px}.hero p{font-size:18px}}
</style>
<style>
.reels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:26px}
.reel-card{background:linear-gradient(160deg,#172239,#10182a);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.reel-card:hover{transform:translateY(-4px);border-color:#ff4d8d77;box-shadow:0 14px 40px -12px #ff4d8d33}
.reel-card img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;margin-bottom:10px;background:#2a2440;display:block}
.reel-card .badge{position:absolute;top:22px;right:22px;background:linear-gradient(135deg,#ff4d8d,#ff8b64);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;z-index:2;box-shadow:0 4px 14px #ff4d8d55}
.reel-card h3{font-size:15px;margin:6px 0;color:#fff;line-height:1.8}
.reel-card p{font-size:13px;color:var(--muted);margin:4px 0 12px;line-height:1.8}
.reel-card a{color:#ff8db4;font-size:13px;font-weight:700;display:inline-block;transition:.2s}
.reel-card a:hover{color:#ff4d8d}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="#">INSTA<span>RO</span></a>
    <div class="navsmall">گلچین روزانه اینستاگرام</div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <div class="pill">✦ انتخاب‌شده برای تو، نه الگوریتم</div>
    <h1>امروز چی رو <span class="grad">از دست دادی؟</span></h1>
    <p>یک‌جا، هر روز، بدون اسکرول بی‌پایان.</p>
  </section>

  <section>
    <div class="reels-grid" id="reels-container"></div>
    <p class="note">این نسخه، پیش‌نمایش اولیه سایت است. لینک‌ها و آمار واقعی پس از شروع گردآوری روزانه محتوا اضافه می‌شوند.</p>
  </section>
</main>
<footer>
  <div class="wrap">INSTARO © 2026 — امروز چی رو از دست دادی؟</div>
</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd5580Rh_4Zmc-rSH5cx5BOIN9MPaNp71lN_09PjV4YLylGpEC1vhBpgtc7y3a5BSsxj-2lO2oDVM1/pub?gid=0&single=true&output=csv';

async function loadReels() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    const rows = text.trim().split('\n').map(r => r.split(','));
    const headers = rows[0].map(x => x.trim());
    
    let data = rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((k, i) => obj[k] = (r[i] || '').trim());
      return obj;
    });

    // مرتب‌سازی بر اساس گروه (group) تا کارت‌های یک گروه کنار هم بیایند
    data.sort((a, b) => {
      const groupA = a.group || a.category || '';
      const groupB = b.group || b.category || '';
      if (groupA < groupB) return -1;
      if (groupA > groupB) return 1;
      return 0;
    });

    // برعکس کردن ترتیب برای اینکه جدیدترین‌ها اول بیان
    data.reverse();

    document.getElementById('reels-container').innerHTML = data.map(r => `
      <div class="reel-card">
        ${r.cover ? `<img src="${r.cover}" alt="${r.title}" loading="lazy">` : ''}
        ${r.category ? `<span class="badge">${r.category}</span>` : ''}
        <h3>${r.title}</h3>
        <p>${r.description}</p>
        <a href="${r.link}" target="_blank">مشاهده در اینستاگرام</a>
      </div>`).join('');
  } catch (e) {
    console.error(e);
  }
}
loadReels();
</script>
</body>
</html>
