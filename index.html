<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اینستارو | امروز چی رو از دست دادی؟</title>
<style>
  body { font-family: Tahoma, sans-serif; background:#0f0f0f; color:#fff; margin:0; padding:20px; }
  header { text-align:center; margin-bottom:30px; }
  header h1 { font-size:24px; }
  header p { color:#aaa; font-size:14px; }
  .reels-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; max-width:1000px; margin:0 auto; }
  .reel-card { background:#1a1a1a; border-radius:12px; padding:14px; position:relative; }
  .reel-card .badge { position:absolute; top:12px; left:12px; background:#ff0050; color:#fff; font-size:11px; padding:2px 8px; border-radius:20px; }
  .reel-card h3 { font-size:15px; margin:6px 0; }
  .reel-card p { font-size:13px; color:#aaa; margin:4px 0 10px; }
  .reel-card a { color:#ff0050; font-size:13px; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>امروز چی رو از دست دادی؟</h1>
  <p>🔥 ریلزهای پربازدید — منتخب روز</p>
</header>

<div id="reels-container" class="reels-grid"></div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRd5580Rh_4Zmc-rSH5cx5BOIN9MPaNp71lN_09PjV4YLylGpEC1vhBpgtc7y3a5BSsxj-2lO2oDVM1/pub?gid=0&single=true&output=csv';

async function loadReels() {
  const res = await fetch(CSV_URL + '&t=' + Date.now());
  const text = await res.text();
  const rows = text.trim().split('\n').map(r => r.split(','));
  const headers = rows[0].map(x => x.trim());
  const data = rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((k, i) => obj[k] = (r[i] || '').trim());
    return obj;
  });
  document.getElementById('reels-container').innerHTML = data.map(r => `
    <div class="reel-card">
      ${r.category ? `<span class="badge">${r.category}</span>` : ''}
      <h3>${r.title}</h3>
      <p>${r.description}</p>
      <a href="${r.link}" target="_blank">مشاهده در اینستاگرام</a>
    </div>`).join('');
}
loadReels();
</script>
</body>
</html>
